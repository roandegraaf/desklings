services:
  schermes:
    build: .
    container_name: schermes
    # tini reaps the detached Xvnc/Chromium processes that setsid reparents to PID 1.
    init: true
    shm_size: 1gb
    # Chromium's own sandbox needs unshare(CLONE_NEWNET), which Docker's default seccomp
    # profile denies. Relaxing the container is preferable to running Chromium --no-sandbox.
    security_opt:
      - seccomp=unconfined
    # The web port is the only thing schermes exposes.
    ports:
      - "127.0.0.1:${SCHERMES_PORT:-7777}:${SCHERMES_PORT:-7777}"
    environment:
      SCHERMES_PORT: "${SCHERMES_PORT:-7777}"
    # The database, the master key and the desktop state directory. Named rather than bound, so
    # a fresh volume inherits the image's ownership and modes and master.key stays 0600 under
    # the schermes user. Without it every rebuild silently starts on an empty database.
    volumes:
      - schermes-data:/var/lib/schermes

volumes:
  schermes-data:
