name: Schermes

options:
  bundleIdPrefix: dev.schermes
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

# Automatic signing on the owner's paid team, which is what a device build and the push
# entitlement need: Xcode registers the App ID with the push capability and makes the profile
# on the first `-allowProvisioningUpdates` build. Target level, not project level: XcodeGen
# writes `CODE_SIGN_IDENTITY = "iPhone Developer"` onto every iOS-capable target, and a target
# setting beats a project one. A clone without this team builds for the simulator by putting
# `CODE_SIGN_IDENTITY: "-"`, `CODE_SIGN_STYLE: Manual` and an empty team back here.
signing: &signing
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: 69G9C748N4

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Schermes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Schermes
    dependencies:
      - target: SchermesShare
        destinationFilters: [iOS]
    info:
      path: Schermes/Info.plist
      properties:
        CFBundleDisplayName: Schermes
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # The daemon speaks plain HTTP by design; TLS belongs to a proxy in front of it.
        # See apple/README.md.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # A daemon on the LAN is the ordinary case, and iOS asks before the first connection to
        # one. Without this the prompt gives no reason for the app's own main path.
        NSLocalNetworkUsageDescription:
          Schermes connects to your daemon, which usually runs on this network.
        # "Send to Schermes…" in the Mac Services menu (ignored on iOS). Handled by `ShareService`.
        NSServices:
          - NSMenuItem:
              default: Send to Schermes…
            NSMessage: sendToSchermes
            NSPortName: Schermes
            NSSendTypes: [public.utf8-plain-text, public.url, public.file-url]
            NSSendFileTypes: [public.item]
            NSRequiredContext: {}
    settings:
      base:
        <<: *signing
        PRODUCT_BUNDLE_IDENTIFIER: dev.schermes.Schermes
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        # One 1024 rendered from the app's own avatar engine; see apple/README.md.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Theme.ink, for the chrome SwiftUI's `.tint` doesn't reach (alerts, dialogs).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # `import zlib` resolves against the SDK's own module, but nothing links libz for us.
        # ZRLE is one continuous inflate stream, which is what zlib gives and the Compression
        # framework's raw-deflate API does not.
        OTHER_LDFLAGS: "-lz"
        # Push needs the entitlement, and the entitlement needs a provisioning profile, which
        # only a device build signed by a real team has. Ad-hoc simulator and Mac builds carry
        # none: a Mac app with a restricted entitlement and no profile does not launch.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Schermes/Schermes.entitlements

  # The share sheet's "Schermes" entry. It has no `Session`: the address and a copy of the
  # password come from the app group, which only a device build signed by the team carries.
  SchermesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SchermesShare
      - path: Schermes/Share.swift
      - path: Schermes/Session.swift
      - path: Schermes/Api/SchermesClient.swift
      - path: Schermes/Api/Types.swift
    info:
      path: SchermesShare/Info.plist
      properties:
        CFBundleDisplayName: Schermes
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        # A bundle of its own, so its own exceptions: the daemon is plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription:
          Schermes connects to your daemon, which usually runs on this network.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    settings:
      base:
        <<: *signing
        PRODUCT_BUNDLE_IDENTIFIER: dev.schermes.Schermes.Share
        # Leaves out the app-only `registerDevice`, whose `PushRegistration` lives with the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCHERMES_EXTENSION"
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: SchermesShare/SchermesShare.entitlements

  SchermesTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SchermesTests
    dependencies:
      - target: Schermes
    settings:
      base:
        <<: *signing
        PRODUCT_BUNDLE_IDENTIFIER: dev.schermes.SchermesTests
        GENERATE_INFOPLIST_FILE: YES
        # The ZRLE test deflates its own fixtures, so this target imports zlib too.
        OTHER_LDFLAGS: "-lz"
        # XcodeGen writes the iOS shape of this for a multiplatform target; a Mac app keeps its
        # executable inside the bundle.
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Schermes.app/Contents/MacOS/Schermes"

schemes:
  Schermes:
    build:
      targets:
        Schermes: all
        SchermesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SchermesTests
